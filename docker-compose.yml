name: moonx

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: moonx
      POSTGRES_PASSWORD: moonx
      POSTGRES_DB: moonx
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U moonx -d moonx"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
